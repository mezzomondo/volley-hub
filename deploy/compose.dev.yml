# Local development.
#   docker compose -f deploy/compose.dev.yml --env-file .env up -d --build
# DEV_VIDEO_DIR (in .env) is a local folder with match videos, mounted read-only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: volleyhub
      POSTGRES_USER: volleyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "volleyhub"]
      interval: 5s
  api: &app
    build: ../api
    init: true
    environment: &appenv
      DATABASE_URL: postgresql://volleyhub:${POSTGRES_PASSWORD}@db:5432/volleyhub
      PUBLIC_URL: http://127.0.0.1:8000
      SIGNING_KEY: ${SIGNING_KEY:-dev-only-signing-key}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DEV_VIDEO_DIR:-./empty}:/data/videos:ro
      - clips:/data/clips
    depends_on:
      db: {condition: service_healthy}
  worker:
    <<: *app
    command: ["python", "-m", "volleyhub.worker"]
    ports: []
volumes:
  pgdata:
  clips:
