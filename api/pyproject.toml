[project]
name = "volleyhub"
version = "0.1.0"
description = "volley-hub API, MCP server and clip worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "mcp>=2.3,<3",
    "duckdb>=1.1",
]

[project.scripts]
volleyhub = "volleyhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
